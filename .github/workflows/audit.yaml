# Generated by dx/scripts/audit-sync from ci-templates/audit-micropython-firmware.yaml.
# Do not edit directly — change the template and re-run audit-sync.

name: Security Audit

# Advisory scans run daily; every job runs on Mondays and on a push that
# changes what the image links.
on:
  schedule:
    - cron: "0 6 * * 0,2-6" # Daily at 06:00 UTC, except Monday
    - cron: "0 6 * * 1" # Monday at 06:00 UTC: every job
  push:
    branches: [development, main]
    paths:
      - "boards/**"
      - "cmodules/**"
      - ".github/workflows/audit.yaml"
  workflow_dispatch: {}

# A newer push supersedes an older one; schedules queue apart from pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ESP_IDF_SBOM_VERSION: "1.4.0"
  # The MicroPython release the image builds from, as in ci.yaml and
  # release.yaml; bump them together.
  MICROPYTHON_VERSION: "1.29.0"
  MICROPYTHON_SHA256: "d925a7c664e79a2bdf3dfcb285ba5e2237041cc35a0bd4ee573b6c5711efeca0"

defaults:
  run:
    shell: bash

jobs:
  scan:
    name: ESP-IDF Vulnerability Check (esp-idf-sbom)
    # Weekly: its SBOM needs a firmware build of every board.
    if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The ESP-IDF image the pinned MicroPython release builds on, the same one
    # CI and the release build in. A container job skips the image's
    # entrypoint, so steps source export.sh.
    container:
      image: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    outputs:
      result: ${{ steps.scan.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install esp-idf-sbom
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          pip install --quiet "esp-idf-sbom==$ESP_IDF_SBOM_VERSION"
      - name: Fetch the pinned MicroPython source
        run: |
          mp=".micropython/micropython-$MICROPYTHON_VERSION"
          if [[ -f "$mp/.fetched" ]]; then
            echo "MicroPython $MICROPYTHON_VERSION source is at $mp"
            exit 0
          fi
          tarball=".micropython/micropython-$MICROPYTHON_VERSION.tar.xz"
          mkdir -p .micropython
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$tarball" \
            "https://github.com/micropython/micropython/releases/download/v$MICROPYTHON_VERSION/micropython-$MICROPYTHON_VERSION.tar.xz"
          echo "$MICROPYTHON_SHA256  $tarball" | sha256sum -c -
          rm -rf "$mp"
          tar -xJf "$tarball" -C .micropython \
            --exclude='*/lib/stm32lib' --exclude='*/lib/nrfx' --exclude='*/lib/btstack' \
            --exclude='*/lib/CMSIS_5' --exclude='*/lib/CMSIS_6' --exclude='*/lib/nxp_driver' \
            --exclude='*/lib/psoc-edge' --exclude='*/lib/alif*' --exclude='*/lib/fsp' \
            --exclude='*/lib/asf4' --exclude='*/lib/pico-sdk'
          rm "$tarball"
          touch "$mp/.fetched"
      # Each board is its own image and links its own set of ESP-IDF
      # components, so each gets its own SBOM. Each board builds as it does in
      # CI, through ports/esp32 into its build-<board>/ directory, whose
      # project_description.json the SBOM is made from.
      - name: Build every board
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          mp=".micropython/micropython-$MICROPYTHON_VERSION"
          make -s -C "$mp/mpy-cross" -j "$(nproc)"
          mkdir -p build/sbom
          for board in ESP32_GENERIC_S3 ESP32_GENERIC_C3; do
            make -C "$mp/ports/esp32" BOARD="$board" BOARD_DIR="$PWD/boards/$board" \
              USER_C_MODULES="$PWD/cmodules/micropython.cmake"
            esp-idf-sbom create "$mp/ports/esp32/build-$board/project_description.json" \
              -o "build/sbom/$board.spdx"
          done
      # esp-idf-sbom exits 1 when a package is vulnerable and with another code
      # when it can't run (an NVD outage, a bad SBOM). Only the first files a
      # security issue; the second fails the run without filing anything.
      # CVEs Espressif has analysed as not applying are excluded by the tool.
      - name: Check against the NVD
        id: scan
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          result=clean
          for board in ESP32_GENERIC_S3 ESP32_GENERIC_C3; do
            echo "## $board" >> "$GITHUB_STEP_SUMMARY"
            set +e
            esp-idf-sbom --no-progress --no-hint check --format markdown \
              -o "build/sbom/$board.md" "build/sbom/$board.spdx"
            code=$?
            set -e
            cat "build/sbom/$board.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            if [[ $code -eq 1 ]]; then
              result=vulnerable
            elif [[ $code -ne 0 && $result != vulnerable ]]; then
              echo "::error::esp-idf-sbom check could not run for $board (exit $code)"
              result=error
            fi
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"

  report:
    name: Report
    needs: scan
    # Not when the scan was skipped: no result must not resolve an open issue.
    if: always() && needs.scan.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      - name: Report failure
        if: needs.scan.outputs.result == 'vulnerable'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: esp-idf-sbom found a vulnerability"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: needs.scan.outputs.result == 'clean'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: esp-idf-sbom found a vulnerability"
          github-token: ${{ steps.app-token.outputs.token }}
      # Red in the Actions tab whenever the scan found something or couldn't
      # run, including a scan job that failed before it could classify.
      - name: Fail job unless the scan was clean
        if: needs.scan.outputs.result != 'clean'
        run: exit 1

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create app token for pm issue filing
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.PROJECTS_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECTS_GH_APP_PRIVATE_KEY }}
          owner: qualithm
      # Every branch's whole history: a secret a later commit removed is still leaked.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          # Pinned release plus the sha256 of its linux_x64 tarball from the
          # release's checksums file. Bump both values together.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # gitleaks loads a committed .gitleaks.toml on its own, so its allowlist is
      # the only exemption. --verbose lists each finding's rule, file, line and
      # commit for triage, --redact masks the secret in it, and no report file is
      # written or uploaded.
      - name: Scan the history for secrets
        id: scan
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 --no-banner --log-opts=--all .
      - name: Report failure
        if: steps.scan.outcome == 'failure'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: report
          title: "${{ github.event.repository.name }}: gitleaks found a leaked secret"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Resolve stale failure issue
        if: steps.scan.outcome == 'success'
        uses: ./.github/actions/report-scan-failure
        with:
          mode: resolve
          title: "${{ github.event.repository.name }}: gitleaks found a leaked secret"
          github-token: ${{ steps.app-token.outputs.token }}
      - name: Fail job if the scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
