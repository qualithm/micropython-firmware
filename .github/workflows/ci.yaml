# Generated by dx/scripts/ci-sync from ci-templates/micropython-firmware.yaml.
# Do not edit directly — change the template and re-run ci-sync.

name: CI

on:
  pull_request:
    branches: [main, test, development]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  # Exact PyPI wheel versions, installed into the IDF image's Python. The
  # repo's .claude/checks.json pins the same ones; bump them together.
  # CLANG_TOOLS_VERSION and GCOVR_VERSION are esp-idf-firmware's.
  CLANG_TOOLS_VERSION: "22.1.8"
  GCOVR_VERSION: "8.6"
  RUFF_VERSION: "0.17.1"
  COVERAGE_VERSION: "7.16.2"
  # One MicroPython release tarball builds the Unix port the tests run on and
  # the firmware image, and holds every submodule the two need. The checksum
  # is the release asset's; bump both together, here and in the release
  # template and the checks.
  MICROPYTHON_VERSION: "1.29.0"
  MICROPYTHON_SHA256: "d925a7c664e79a2bdf3dfcb285ba5e2237041cc35a0bd4ee573b6c5711efeca0"

# Every job runs in the ESP-IDF image the pinned MicroPython release builds on,
# which dx/images.json allows for each micropython-firmware repo; `dx ci sync`
# writes its reference. A container job skips the image's entrypoint, so each
# step that needs the IDF sources export.sh itself. The MicroPython source is
# fetched into .micropython/ (gitignored), checked against its checksum, with
# the libraries of ports this firmware never builds left out.
defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      reuse: ${{ steps.reuse.outputs.reuse == 'true' }}
      coverage-run: ${{ steps.reuse.outputs.coverage-run }}
      code: ${{ steps.f.outputs.code == 'true' || steps.f.outputs.ci == 'true' }}
      is-main: ${{ steps.tier.outputs.is-main }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: f
        with:
          # A file must match every pattern. Under the default, any one match
          # is enough, so '**' alone marks every file as code and no exclusion
          # applies.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.github/**'
              - '!.githooks/**'
              - '!.vscode/**'
              - '!LICENSE'
            # The one file under .github/ that changes what these jobs run.
            ci:
              - '.github/workflows/ci.yaml'
      - id: tier
        run: |
          if [[ "${{ github.base_ref }}" == "main" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "is-main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-main=false" >> "$GITHUB_OUTPUT"
          fi
      # A promotion PR usually holds a tree an earlier run already tested:
      # a merge_group or push run tests exactly the commit it names. A
      # merge_group run often holds the tree its PR's last run tested, when the
      # base hasn't moved since; that run recorded the tree as a
      # ci-tree-<tree> artifact (below). A push to main squashes the PR whose
      # run recorded its tree, unless it changes what a cache is keyed on: then
      # it runs in full so its jobs save the caches PRs restore. A reused push
      # still uploads coverage, from the report a passing run recorded for the
      # tree; with none, it runs in full. When a passing run tested this tree,
      # the build, lint, format, typecheck and unit-test jobs skip.
      # Any failed lookup means no reuse.
      - id: reuse
        if:
          github.event_name == 'merge_group' || github.event_name == 'push' || (github.event_name ==
          'pull_request' && github.base_ref != 'development')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          COVERAGE: "true"
          # Lockfiles, toolchain pins and this workflow: what cache keys hash.
          CACHE_INPUTS: '(^|/)(bun\.lock|Cargo\.(lock|toml)|rust-toolchain(\.toml)?|go\.(mod|sum)|[^/]*\.csproj|Directory\.Packages\.props|global\.json|[^/]*\.gradle(\.kts)?|libs\.versions\.toml|gradle-wrapper\.properties|pyproject\.toml|uv\.lock|requirements[^/]*\.txt|Package\.(swift|resolved)|\.github/workflows/ci\.yaml)$'
        run: |
          tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq .tree.sha) || exit 0
          if [[ "$EVENT" == "push" ]]; then
            # The compare API lists at most 300 files: past that, assume a cache input changed.
            files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" \
              --jq 'if (.files | length) < 300 then .files[].filename else "ci.yaml" end') || exit 0
            if grep -qE "$CACHE_INPUTS" <<< "$files"; then
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              echo "this push changes a cache input; running in full to save the caches"
              exit 0
            fi
          fi
          if [[ "$EVENT" == "merge_group" || "$EVENT" == "push" ]]; then
            # Only this repo's CI, run on a pull_request, that passed.
            workflow=$(gh api "repos/$REPO/actions/workflows/ci.yaml" --jq .id) || exit 0
            passing() {
              local name=$1 filter=$2 id passed
              for id in $(gh api "repos/$REPO/actions/artifacts?name=$name&per_page=20" \
                --jq '.artifacts[] | select(.expired | not) | .workflow_run.id' || true); do
                passed=$(gh api "repos/$REPO/actions/runs/$id" \
                  --jq "select(.workflow_id == $workflow and .conclusion == \"success\"$filter) | .id" || true)
                if [[ "$passed" == "$id" ]]; then
                  echo "$id"
                  return
                fi
              done
            }
            id=$(passing "ci-tree-$tree" ' and .event == "pull_request"')
            if [[ -z "$id" ]]; then
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$EVENT" == "push" && "$COVERAGE" == "true" ]]; then
              coverage=$(passing "coverage-$tree" '')
              if [[ -z "$coverage" ]]; then
                echo "reuse=false" >> "$GITHUB_OUTPUT"
                echo "no passing run recorded coverage for tree $tree; running in full"
                exit 0
              fi
              echo "coverage-run=$coverage" >> "$GITHUB_OUTPUT"
            fi
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "reusing the passing pull_request run $id, which tested tree $tree"
            exit 0
          fi
          shas=$(gh api "repos/$REPO/actions/workflows/ci.yaml/runs?status=success&per_page=30" \
            --jq '.workflow_runs[] | select(.event == "merge_group" or .event == "push") | .head_sha' || true)
          for sha in $shas; do
            if [[ "$(gh api "repos/$REPO/git/commits/$sha" --jq .tree.sha || true)" == "$tree" ]]; then
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              echo "reusing the passing run on $sha, which tested tree $tree"
              exit 0
            fi
          done
          echo "reuse=false" >> "$GITHUB_OUTPUT"
      # A pull_request run records the tree it tests (the merge commit it
      # checked out) for the merge queue's lookup above.
      - name: Record the tested tree
        id: tested
        if: github.event_name == 'pull_request'
        run: |
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/ci-tree"
          echo "tree=$(cat "$RUNNER_TEMP/ci-tree")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: ci-tree-${{ steps.tested.outputs.tree }}
          path: ${{ runner.temp }}/ci-tree
          retention-days: 3
      # Every image reference in the repo must match the vendored dx registry.
      # Here so it runs on every event, docs included (a README can carry an
      # image reference too) without a job of its own (qualithm/pm#3010). A
      # repo with no vendored registry references no container image and skips.
      - name: Check image pins against the vendored dx registry
        run: |
          if [ ! -f .github/images/images.config ]; then
            echo "no vendored registry: repo references no container image; skipping"
            exit 0
          fi
          .github/images/images check --config .github/images/images.config .

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install clang-format and ruff
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          pip install --quiet "clang-format==$CLANG_TOOLS_VERSION" "ruff==$RUFF_VERSION"
      - name: Format check (C)
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          git -c safe.directory='*' ls-files -z '*.c' '*.h' | xargs -0 --no-run-if-empty clang-format --dry-run --Werror
      - name: Format check (Python)
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          ruff format --check modules tests

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install clang-tidy and ruff
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          pip install --quiet "clang-tidy==$CLANG_TOOLS_VERSION" "ruff==$RUFF_VERSION"
      - name: ruff
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          ruff check modules tests
      # clang-tidy reads the host-test build's compile database, so it checks
      # the user C modules' logic with the flags the tests compile it with. The
      # MicroPython bindings (mod*.c) need the port's headers and are glue the
      # host build never compiles, so they sit outside it.
      - name: Configure host tests
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          cmake -S test/host -B build/host > /dev/null
      - name: clang-tidy
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          git -c safe.directory='*' ls-files -z 'cmodules/*.c' ':!cmodules/*/mod*.c' \
            | xargs -0 --no-run-if-empty clang-tidy -p build/host --quiet

  host-test:
    name: Host Tests
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
      id-token: write
    timeout-minutes: 20
    container:
      image: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install gcovr and coverage
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          pip install --quiet "gcovr==$GCOVR_VERSION" "coverage==$COVERAGE_VERSION"
      # test/host is a plain CMake project that runs the Unity tests over the
      # user C modules' logic with the image's host GCC, no board needed.
      - name: Build host tests
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          cmake -S test/host -B build/host > /dev/null
          cmake --build build/host
      - name: Run host tests
        run: ./build/host/host_test
      # The C gate covers cmodules/ logic; the bindings (mod*.c) are glue the
      # host build never compiles, so they sit outside it.
      - name: Measure C coverage
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          gcovr --root . --filter 'cmodules/' --lcov lcov.info --print-summary build/host
      - name: Enforce C coverage threshold (>=80%)
        run: |
          awk '/^LF:/ {lf+=substr($0,4)} /^LH:/ {lh+=substr($0,4)} END {
            if (lf == 0) { print "No LF records in lcov.info"; exit 1 }
            pct = (lh / lf) * 100
            printf "Line coverage: %.2f%% (%d/%d)\n", pct, lh, lf
            if (pct + 0 < 80) { print "Coverage below 80% threshold"; exit 1 }
          }' lcov.info
      # MicroPython has no coverage tool, so CPython runs the same unittest
      # tests over modules/ to measure them; the Unix port job runs them on
      # MicroPython itself. A module that imports a board-only name (machine,
      # network) takes a fake from tests/fakes/.
      - name: Measure Python coverage (>=80%)
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          PYTHONPATH="tests/fakes:modules" coverage run --source=modules -m unittest discover -s tests
          coverage report --fail-under=80
          coverage xml -o coverage.xml
      # A reused push to main uploads this report instead of re-running the
      # tests, so record it under the tree it covers (qualithm/pm#3012).
      - name: Record the coverage report
        id: covered
        run: |
          echo "tree=$(git -c safe.directory='*' rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          tar -czf "$RUNNER_TEMP/coverage.tgz" -C "$GITHUB_WORKSPACE" lcov.info coverage.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ steps.covered.outputs.tree }}
          path: ${{ runner.temp }}/coverage.tgz
          retention-days: 14
      - name: Fetch Codecov CLI
        id: codecov-cli
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          # A pinned GitHub release instead of the action's runtime download
          # from cli.codecov.io, whose TLS handshake fails from our runners.
          # Bump both values together.
          CODECOV_CLI_VERSION: v11.3.1
          CODECOV_CLI_SHA256: ca1d64196d2d34771084afe76ea657d581bf628e31d993ff8e52ea09cc88a56d
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/codecov" \
            "https://github.com/codecov/codecov-cli/releases/download/$CODECOV_CLI_VERSION/codecovcli_linux"
          echo "$CODECOV_CLI_SHA256  $RUNNER_TEMP/codecov" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/codecov"
      - name: Upload coverage to Codecov
        id: codecov
        if: ${{ !cancelled() && steps.codecov-cli.outcome == 'success' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          use_oidc: true
          files: lcov.info,coverage.xml
          fail_ci_if_error: true
      - name: Wait before retrying the Codecov upload
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        run: sleep 30
      - name: Retry the Codecov upload
        id: codecov-retry
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          use_oidc: true
          files: lcov.info,coverage.xml
          fail_ci_if_error: true
      # Non-blocking by design: Codecov reports coverage, it never gates it, so
      # a Codecov outage must not fail CI Required. A missed upload surfaces
      # as a warning annotation and a job summary line instead.
      - name: Report a failed Codecov upload
        if:
          ${{ !cancelled() && steps.codecov.outcome != 'success' && steps.codecov-retry.outcome !=
          'success' }}
        run: |
          echo "::warning title=Codecov upload failed::coverage was not uploaded to Codecov after a retry"
          echo "Codecov upload failed after a retry. See the upload steps in this job." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage.xml
          retention-days: 14

  # A reused push to main uploads the coverage a passing run recorded for
  # its tree, so Codecov keeps a report on main (qualithm/pm#3012).
  coverage-upload:
    name: Coverage Upload
    needs: changes
    if: needs.changes.outputs.coverage-run != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Restore the recorded coverage report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ needs.changes.outputs.coverage-run }}
        run: |
          gh run download "$RUN" -R "$REPO" -n "coverage-$(git rev-parse 'HEAD^{tree}')" -D "$RUNNER_TEMP/coverage"
          tar -xzf "$RUNNER_TEMP/coverage/coverage.tgz"
      - name: Fetch Codecov CLI
        id: codecov-cli
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          # A pinned GitHub release instead of the action's runtime download
          # from cli.codecov.io, whose TLS handshake fails from our runners.
          # Bump both values together.
          CODECOV_CLI_VERSION: v11.3.1
          CODECOV_CLI_SHA256: ca1d64196d2d34771084afe76ea657d581bf628e31d993ff8e52ea09cc88a56d
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/codecov" \
            "https://github.com/codecov/codecov-cli/releases/download/$CODECOV_CLI_VERSION/codecovcli_linux"
          echo "$CODECOV_CLI_SHA256  $RUNNER_TEMP/codecov" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/codecov"
      - name: Upload coverage to Codecov
        id: codecov
        if: ${{ !cancelled() && steps.codecov-cli.outcome == 'success' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          use_oidc: true
          files: lcov.info,coverage.xml
          fail_ci_if_error: true
      - name: Wait before retrying the Codecov upload
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        run: sleep 30
      - name: Retry the Codecov upload
        id: codecov-retry
        if: ${{ !cancelled() && steps.codecov.outcome == 'failure' }}
        continue-on-error: true
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          binary: ${{ runner.temp }}/codecov
          use_oidc: true
          files: lcov.info,coverage.xml
          fail_ci_if_error: true
      # Non-blocking by design: Codecov reports coverage, it never gates it, so
      # a Codecov outage must not fail CI Required. A missed upload surfaces
      # as a warning annotation and a job summary line instead.
      - name: Report a failed Codecov upload
        if:
          ${{ !cancelled() && steps.codecov.outcome != 'success' && steps.codecov-retry.outcome !=
          'success' }}
        run: |
          echo "::warning title=Codecov upload failed::coverage was not uploaded to Codecov after a retry"
          echo "Codecov upload failed after a retry. See the upload steps in this job." >> "$GITHUB_STEP_SUMMARY"

  micropython:
    name: Test (MicroPython Unix port)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .micropython/micropython-${{ env.MICROPYTHON_VERSION }}
          # The tree holds each board's ESP-IDF build output, so a new image needs a fresh cache.
          key:
            micropython-${{ github.job }}-${{ env.MICROPYTHON_SHA256 }}-espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
      - name: Fetch the pinned MicroPython source
        run: |
          mp=".micropython/micropython-$MICROPYTHON_VERSION"
          if [[ -f "$mp/.fetched" ]]; then
            echo "MicroPython $MICROPYTHON_VERSION source is at $mp"
            exit 0
          fi
          tarball=".micropython/micropython-$MICROPYTHON_VERSION.tar.xz"
          mkdir -p .micropython
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$tarball" \
            "https://github.com/micropython/micropython/releases/download/v$MICROPYTHON_VERSION/micropython-$MICROPYTHON_VERSION.tar.xz"
          echo "$MICROPYTHON_SHA256  $tarball" | sha256sum -c -
          rm -rf "$mp"
          tar -xJf "$tarball" -C .micropython \
            --exclude='*/lib/stm32lib' --exclude='*/lib/nrfx' --exclude='*/lib/btstack' \
            --exclude='*/lib/CMSIS_5' --exclude='*/lib/CMSIS_6' --exclude='*/lib/nxp_driver' \
            --exclude='*/lib/psoc-edge' --exclude='*/lib/alif*' --exclude='*/lib/fsp' \
            --exclude='*/lib/asf4' --exclude='*/lib/pico-sdk'
          rm "$tarball"
          touch "$mp/.fetched"
      # The Unix port and its unittest come from the same tarball the image
      # builds from, so the tests run on the interpreter the firmware ships.
      # FFI is left out: no test needs it.
      - name: Build the Unix port
        run: |
          mp=".micropython/micropython-$MICROPYTHON_VERSION"
          make -s -C "$mp/mpy-cross" -j "$(nproc)"
          make -s -C "$mp/ports/unix" -j "$(nproc)" MICROPY_PY_FFI=0
          stdlib="$mp/lib/micropython-lib/python-stdlib"
          mkdir -p "$mp/test-lib/unittest"
          cp "$stdlib/unittest/unittest/__init__.py" "$stdlib/unittest-discover/unittest/__main__.py" \
            "$mp/test-lib/unittest/"
          cp "$stdlib/argparse/argparse.py" "$stdlib/fnmatch/fnmatch.py" "$mp/test-lib/"
      - name: Check the Unix port matches the pin
        run: |
          mp=".micropython/micropython-$MICROPYTHON_VERSION"
          "$mp/ports/unix/build-standard/micropython" -c 'import sys; print(sys.version)' \
            | tee /dev/stderr | grep -q "MicroPython v$MICROPYTHON_VERSION"
      # The fakes come first so board-only names resolve to them, then the
      # frozen modules, then unittest; .frozen keeps the port's own modules.
      - name: Run the tests on the Unix port
        run: |
          mp=".micropython/micropython-$MICROPYTHON_VERSION"
          MICROPYPATH="tests/fakes:modules:$mp/test-lib:.frozen" \
            "$mp/ports/unix/build-standard/micropython" -m unittest discover -s tests

  build:
    name: Build (${{ matrix.board }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Each board is its own product image, not a compatibility leg, so
        # both build on every tier.
        board: [ESP32_GENERIC_S3, ESP32_GENERIC_C3]
    container:
      image: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .micropython/micropython-${{ env.MICROPYTHON_VERSION }}
          # The tree holds each board's ESP-IDF build output, so a new image needs a fresh cache.
          key:
            micropython-${{ github.job }}-${{ env.MICROPYTHON_SHA256 }}-espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
      - name: Fetch the pinned MicroPython source
        run: |
          mp=".micropython/micropython-$MICROPYTHON_VERSION"
          if [[ -f "$mp/.fetched" ]]; then
            echo "MicroPython $MICROPYTHON_VERSION source is at $mp"
            exit 0
          fi
          tarball=".micropython/micropython-$MICROPYTHON_VERSION.tar.xz"
          mkdir -p .micropython
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$tarball" \
            "https://github.com/micropython/micropython/releases/download/v$MICROPYTHON_VERSION/micropython-$MICROPYTHON_VERSION.tar.xz"
          echo "$MICROPYTHON_SHA256  $tarball" | sha256sum -c -
          rm -rf "$mp"
          tar -xJf "$tarball" -C .micropython \
            --exclude='*/lib/stm32lib' --exclude='*/lib/nrfx' --exclude='*/lib/btstack' \
            --exclude='*/lib/CMSIS_5' --exclude='*/lib/CMSIS_6' --exclude='*/lib/nxp_driver' \
            --exclude='*/lib/psoc-edge' --exclude='*/lib/alif*' --exclude='*/lib/fsp' \
            --exclude='*/lib/asf4' --exclude='*/lib/pico-sdk'
          rm "$tarball"
          touch "$mp/.fetched"
      # MicroPython's own make flow: mpy-cross compiles the frozen modules,
      # then ports/esp32 builds the board in boards/<board>/ with the user C
      # modules linked in, into its own ports/esp32/build-<board>/. BUILD is
      # left alone: make passes it on to the mpy-cross sub-make.
      - name: Build
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          mp=".micropython/micropython-$MICROPYTHON_VERSION"
          make -s -C "$mp/mpy-cross" -j "$(nproc)"
          make -C "$mp/ports/esp32" BOARD="${{ matrix.board }}" BOARD_DIR="$PWD/boards/${{ matrix.board }}" \
            USER_C_MODULES="$PWD/cmodules/micropython.cmake"
      - name: Size report
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          mp=".micropython/micropython-$MICROPYTHON_VERSION"
          make -s -C "$mp/ports/esp32" BOARD="${{ matrix.board }}" BOARD_DIR="$PWD/boards/${{ matrix.board }}" \
            USER_C_MODULES="$PWD/cmodules/micropython.cmake" size \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # Runs only when a job failed or was cancelled, and fails then. On a green
  # run it skips, which bills nothing and still satisfies the required check:
  # GitHub reports a job skipped by its `if` as successful (qualithm/pm#3010).
  ci-required:
    name: CI Required
    if: failure() || cancelled()
    needs: [changes, coverage-upload, format, lint, host-test, micropython, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify dependent jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' \
            || { echo "::error::One or more required jobs failed or were cancelled"; exit 1; }
