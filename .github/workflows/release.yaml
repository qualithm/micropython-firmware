# Generated by dx/scripts/release-sync from ci-templates/release-micropython-firmware.yaml.
# Do not edit directly — change the template and re-run release-sync.

name: Release

on:
  push:
    tags: ["*.*.*"]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # The same MicroPython release tarball CI builds from; bump both together.
  MICROPYTHON_VERSION: "1.29.0"
  MICROPYTHON_SHA256: "d925a7c664e79a2bdf3dfcb285ba5e2237041cc35a0bd4ee573b6c5711efeca0"

defaults:
  run:
    shell: bash

jobs:
  build-images:
    if: ${{ !endsWith(github.repository, '-example') }}
    name: Build Image (${{ matrix.board }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - board: ESP32_GENERIC_S3
            target: esp32s3
          - board: ESP32_GENERIC_C3
            target: esp32c3
    # The ESP-IDF image the pinned MicroPython builds on, the same one CI uses. A
    # container job skips the image's entrypoint, so steps source export.sh.
    container:
      image: espressif/idf:v5.5.5@sha256:a9231d0697ab8f7517cc072e93b7c83e04907bfbfba80b6440d7dbbf90665cf2
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # A tag build must carry the tag's version; a dispatch from a branch
      # builds version.txt as it stands.
      - name: Resolve build version
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version.txt)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "::error file=version.txt::tag ${GITHUB_REF_NAME} does not match version.txt (${version})"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch the pinned MicroPython source
        run: |
          mp=".micropython/micropython-$MICROPYTHON_VERSION"
          if [[ -f "$mp/.fetched" ]]; then
            echo "MicroPython $MICROPYTHON_VERSION source is at $mp"
            exit 0
          fi
          tarball=".micropython/micropython-$MICROPYTHON_VERSION.tar.xz"
          mkdir -p .micropython
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$tarball" \
            "https://github.com/micropython/micropython/releases/download/v$MICROPYTHON_VERSION/micropython-$MICROPYTHON_VERSION.tar.xz"
          echo "$MICROPYTHON_SHA256  $tarball" | sha256sum -c -
          rm -rf "$mp"
          tar -xJf "$tarball" -C .micropython \
            --exclude='*/lib/stm32lib' --exclude='*/lib/nrfx' --exclude='*/lib/btstack' \
            --exclude='*/lib/CMSIS_5' --exclude='*/lib/CMSIS_6' --exclude='*/lib/nxp_driver' \
            --exclude='*/lib/psoc-edge' --exclude='*/lib/alif*' --exclude='*/lib/fsp' \
            --exclude='*/lib/asf4' --exclude='*/lib/pico-sdk'
          rm "$tarball"
          touch "$mp/.fetched"

      - name: Build
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          mp=".micropython/micropython-$MICROPYTHON_VERSION"
          make -s -C "$mp/mpy-cross" -j "$(nproc)"
          make -C "$mp/ports/esp32" BOARD="${{ matrix.board }}" BOARD_DIR="$PWD/boards/${{ matrix.board }}" \
            USER_C_MODULES="$PWD/cmodules/micropython.cmake"

      # boards/firmware.cmake reads version.txt into PROJECT_VER, which IDF
      # stamps into the image's app description, and into the board name the
      # REPL banner shows beside the MicroPython version. Read both back and
      # refuse an image that disagrees.
      - name: Verify stamped versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          build=".micropython/micropython-$MICROPYTHON_VERSION/ports/esp32/build-${{ matrix.board }}"
          # The IDF image has Python but no jq.
          stamped=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["project_version"])' \
            "$build/project_description.json")
          if [[ "$stamped" != "$VERSION" ]]; then
            echo "::error::the image reports version '${stamped}', expected '${VERSION}': boards/firmware.cmake must set PROJECT_VER from version.txt"
            exit 1
          fi
          if ! grep -aq "MicroPython v$MICROPYTHON_VERSION" "$build/micropython.bin"; then
            echo "::error::the image doesn't report MicroPython v$MICROPYTHON_VERSION"
            exit 1
          fi
          # The banner's machine string reads "<name> <version> with <chip>".
          if ! grep -aq " $VERSION with " "$build/micropython.bin"; then
            echo "::error::the image's board name doesn't carry version ${VERSION}: boards/firmware.cmake must append it"
            exit 1
          fi

      # Qualithm signing plugs in here, and only in Qualithm's own firmware
      # repos: a template or example repo never holds signing keys. With
      # Secure Boot v2 on, a signing job holding the Qualithm key signs the
      # bootloader and app binaries under ports/esp32/build-<board>/ (espsecure.py
      # sign_data --version 2) before the merge below, and the assets drop
      # their -unsigned suffix. Until then every release image is unsigned.

      # One flashable image per board, written at offset 0 with
      # `esptool.py --chip <target> write_flash 0x0 <file>`. MicroPython's
      # make flow merges bootloader, partition table and app into firmware.bin.
      - name: Merge flashable image
        id: image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          name="${GITHUB_REPOSITORY#*/}-${VERSION}-${{ matrix.target }}-unsigned.bin"
          mkdir -p dist
          cp ".micropython/micropython-$MICROPYTHON_VERSION/ports/esp32/build-${{ matrix.board }}/firmware.bin" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.target }}
          path: dist/
          retention-days: 1

  github-release:
    name: Create GitHub Release
    if: ${{ !endsWith(github.repository, '-example') && (github.ref_type == 'tag') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build-images
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: dist
          merge-multiple: true

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release for $TAG already exists, skipping"
            exit 0
          fi

          # PREV_TAG is the most recent tag reachable before this one, if any.
          PREV_TAG=$(git tag --sort=-creatordate --merged "$TAG" | grep -Fxv "$TAG" | head -1 || true)

          # Injected from dx ci-templates/_changelog-notes.py by release-sync — do not
          # hand-edit; change the source script and re-run release-sync.
          # Recursively unpacks squashed promotion-hop commits back to their
          # real leaf commits, since `gh release create --generate-notes`
          # can't see past the single squash-commit each development -> test
          # -> main hop produces.
          cat > /tmp/changelog-notes.py <<'PYEOF'
          # changelog-notes — build real release notes for a tag by recursively unpacking
          # squashed promotion-hop commits back to their leaf feat/fix/etc. commits.
          #
          # Neither `gh release create --generate-notes` nor GoReleaser's `changelog.use:
          # github` can do this: both only ever see one squash-commit per development ->
          # test -> main promotion hop, never the real commits that were squashed away.
          # This script walks the commit range for a tag, and for each commit whose title
          # matches the promotion-hop shape, looks up that PR's pre-squash commit list via
          # the GitHub API and recurses into it, until it reaches real leaf commits.
          #
          # Usage:
          #   changelog-notes --repo owner/name --tag TAG [--prev-tag PREV] [--repo-dir DIR]
          #
          # Requires: gh (authenticated), git (run inside, or --repo-dir pointing at, a
          # checkout with full history/tags — i.e. actions/checkout with fetch-depth: 0).
          #
          # Prints the release body (## What's Changed / ## Full Changelog) to stdout.
          import argparse
          import json
          import re
          import subprocess
          import sys

          # Promotion-hop PRs come in a couple of title shapes: dx git merge synthesises
          # "Promote <src> → <dst> (N commits)" (Unicode arrow + count), but older/manual
          # promotions use a bare "Promote <src> -> <dst>" (ASCII arrow, no count). Match
          # both arrows and treat the count as optional so neither slips through as a leaf.
          PROMOTION_TITLE = re.compile(r"^(Promote .* (?:→|->) .*|Merge .* into (main|test|development))")
          LEAF_EXCLUDE = [
              re.compile(r"^docs(\(.+\))?!?:"),
              re.compile(r"^test(\(.+\))?!?:"),
              re.compile(r"^chore(\(.+\))?!?:"),
              re.compile(r"^ci(\(.+\))?!?:"),
              re.compile(r"Merge pull request"),
              re.compile(r"Merge branch"),
          ]


          def gh_api_json(path, method="GET", fields=None):
              cmd = ["gh", "api", path]
              if method != "GET":
                  cmd += ["-X", method]
              for k, v in (fields or {}).items():
                  cmd += ["-f", f"{k}={v}"]
              out = subprocess.run(cmd, capture_output=True, text=True)
              if out.returncode != 0:
                  # Surface the failure so a permission/auth/rate-limit error (which would
                  # otherwise silently degrade every promotion PR to a bare commit entry)
                  # is visible in the log rather than producing wrong-but-green notes.
                  print(f"warning: gh api {path} failed: {out.stderr.strip()}", file=sys.stderr)
                  return None, out.stderr
              return json.loads(out.stdout), None


          class Resolver:
              def __init__(self, repo, repo_dir):
                  self.repo = repo
                  self.repo_dir = repo_dir
                  self.cache = {}

              def pr_for_commit(self, sha):
                  key = f"commit_pr:{sha}"
                  if key in self.cache:
                      return self.cache[key]
                  prs, _ = gh_api_json(f"repos/{self.repo}/commits/{sha}/pulls")
                  result = None
                  if prs:
                      merged = [p for p in prs if p.get("merged_at")]
                      if merged:
                          p = merged[0]
                          result = {
                              "number": p["number"],
                              "title": p["title"],
                              "author": (p.get("user") or {}).get("login"),
                              "url": p.get("html_url"),
                          }
                  self.cache[key] = result
                  return result

              def pr_commits(self, number):
                  key = f"pr_commits:{number}"
                  if key in self.cache:
                      return self.cache[key]
                  commits, _ = gh_api_json(f"repos/{self.repo}/pulls/{number}/commits")
                  result = [c["sha"] for c in (commits or [])]
                  self.cache[key] = result
                  return result

              def commit_info(self, sha):
                  key = f"commit_info:{sha}"
                  if key in self.cache:
                      return self.cache[key]
                  data, _ = gh_api_json(f"repos/{self.repo}/commits/{sha}")
                  author = (data or {}).get("author") or {}
                  msg = subprocess.run(
                      ["git", "-C", self.repo_dir, "log", "-1", "--pretty=format:%s", sha],
                      capture_output=True, text=True, check=True,
                  ).stdout.strip()
                  result = {
                      "title": msg,
                      "author": author.get("login"),
                      "url": f"https://github.com/{self.repo}/commit/{sha}",
                  }
                  self.cache[key] = result
                  return result

              def resolve_leaves(self, sha, seen, depth=0):
                  if sha in seen or depth > 12:
                      return []
                  seen.add(sha)
                  pr = self.pr_for_commit(sha)
                  if pr and PROMOTION_TITLE.match(pr["title"]):
                      leaves = []
                      for inner_sha in self.pr_commits(pr["number"]):
                          leaves.extend(self.resolve_leaves(inner_sha, seen, depth + 1))
                      return leaves
                  return [pr if pr else self.commit_info(sha)]


          def excluded(title):
              return any(p.search(title) for p in LEAF_EXCLUDE)


          def format_bullet(leaf):
              title, author, url = leaf["title"], leaf.get("author"), leaf.get("url")
              if author and url:
                  return f"- {title} by @{author} in {url}"
              if url:
                  return f"- {title} in {url}"
              return f"- {title}"


          def leaf_key(leaf):
              """Stable identity for a leaf: its PR number if known, else its title."""
              number = leaf.get("number")
              return f"#{number}" if number else leaf["title"]


          def collect_leaves(resolver, repo_dir, rng):
              log = subprocess.run(
                  ["git", "-C", repo_dir, "log", rng, "--pretty=format:%H", "--reverse"],
                  capture_output=True, text=True, check=True,
              ).stdout
              shas = [s for s in log.split("\n") if s.strip()]
              seen = set()
              leaves = []
              for sha in shas:
                  leaves.extend(resolver.resolve_leaves(sha, seen))
              return leaves


          def build_bullets(repo, repo_dir, prev, tag):
              resolver = Resolver(repo, repo_dir)
              rng = f"{prev}..{tag}" if prev else tag
              all_leaves = collect_leaves(resolver, repo_dir, rng)

              # A promotion PR's commit list (from the GitHub API) can reach commits from
              # before this release window — long-lived development/test branches and
              # branch-alignment resets both cause this — so the recursion may surface
              # PRs that already shipped in an earlier tag. The prev..tag git range only
              # bounds the top-level promotion commits, not the recursion, and squash
              # merges rule out SHA-ancestry filtering. Subtract everything reachable from
              # prev so an already-released PR never reappears in a later release.
              released = set()
              if prev:
                  released = {leaf_key(leaf) for leaf in collect_leaves(resolver, repo_dir, prev)}

              bullets, seen_keys = [], set()
              for leaf in reversed(all_leaves):  # newest first
                  key = leaf_key(leaf)
                  if key in released or key in seen_keys or excluded(leaf["title"]):
                      continue
                  seen_keys.add(key)
                  bullets.append(format_bullet(leaf))
              return bullets


          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("--repo", required=True, help="owner/name")
              ap.add_argument("--tag", required=True)
              ap.add_argument("--prev-tag", default=None)
              ap.add_argument("--repo-dir", default=".")
              args = ap.parse_args()

              bullets = build_bullets(args.repo, args.repo_dir, args.prev_tag, args.tag)
              parts = ["## What's Changed", ""]
              parts.extend(bullets)
              parts.append("")
              parts.append("## Full Changelog")
              parts.append("")
              if args.prev_tag:
                  parts.append(f"**Full Changelog**: https://github.com/{args.repo}/compare/{args.prev_tag}...{args.tag}")
              print("\n".join(parts))


          if __name__ == "__main__":
              main()
          PYEOF

          if [[ -n "$PREV_TAG" ]]; then
            python3 /tmp/changelog-notes.py --repo "$GH_REPO" --tag "$TAG" --prev-tag "$PREV_TAG" > /tmp/notes.md
          else
            python3 /tmp/changelog-notes.py --repo "$GH_REPO" --tag "$TAG" > /tmp/notes.md
          fi

          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            dist/*
